# The sign-in gate Caddy asks before every read, in the place an ALB
# `authenticate-oidc` action takes in AWS. It answers only `/oauth2/*`;
# `static://202` makes it an auth-only service with no upstream of its own.
# Options: https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview
http_address = "0.0.0.0:4180"
upstreams = ["static://202"]

provider = "keycloak-oidc"
client_id = "biac-dashboard"
# Demo values: the client secret matches keycloak/realm.json, and the
# cookie secret is 32 bytes so the session cookie can be encrypted.
client_secret = "biac-dashboard-demo-secret"
cookie_secret = "biac-demo-cookie-secret-32-bytes"
code_challenge_method = "S256"
redirect_url = "https://localhost:8443/oauth2/callback"

# The issuer every token names is the edge, but inside this container
# `localhost` is oauth2-proxy itself, so discovery cannot be fetched there:
# the browser signs in on the edge, the code is redeemed and the keys read on
# the compose network.
oidc_issuer_url = "https://localhost:8443/realms/biac"
skip_oidc_discovery = true
login_url = "https://localhost:8443/realms/biac/protocol/openid-connect/auth"
redeem_url = "http://keycloak:8080/realms/biac/protocol/openid-connect/token"
oidc_jwks_url = "http://keycloak:8080/realms/biac/protocol/openid-connect/certs"

# Who may in: anyone the tenant signs in who holds the app role.
email_domains = ["*"]
allowed_roles = ["biac-dashboard:Dashboard.Viewer"]
# Straight to the identity provider, as an ALB does; no "Sign in with" page.
skip_provider_button = true

# Behind Caddy, which sets X-Forwarded-{Proto,Host,Uri}. Only containers on
# the compose network reach this port, so no `trusted_proxy_ips` list is kept.
reverse_proxy = true
