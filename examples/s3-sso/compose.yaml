# A biac `build/` in a private, authenticated S3 bucket (moto), provisioned by
# Terraform and readable only through a SigV4 signing proxy, served over TLS
# by Caddy, which asks oauth2-proxy before every read; viewers sign in at
# Keycloak. Only Caddy publishes ports, and only on loopback: the bucket,
# the signer, Keycloak and oauth2-proxy live on the compose network.
name: s3-sso

services:
  moto:
    image: motoserver/moto:5.2.4@sha256:120b1589c6df7e35d2092935f6ff724486bb2c4189d0e36ce795baba1400ffd2
    labels:
      org.biac.note: "local demonstration — not a production store"
    environment:
      # Three unauthenticated calls let bootstrap.sh create the deployer;
      # unset, moto would never authenticate anything.
      INITIAL_NO_AUTH_ACTION_COUNT: "3"
    healthcheck:
      # /moto-api/ does not count against INITIAL_NO_AUTH_ACTION_COUNT; an
      # S3 or IAM call here would spend the bootstrap's free calls.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')
      interval: 2s
      timeout: 2s
      retries: 30

  bootstrap:
    image: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
    entrypoint: ["sh", "/bootstrap.sh"]
    volumes:
      - ./bootstrap.sh:/bootstrap.sh:ro
      - credentials:/credentials
    depends_on:
      moto:
        condition: service_healthy

  terraform:
    image: hashicorp/terraform:1.17.0@sha256:4d1b496a256f2989bccdb04b9104a4ede97234b10fba90259e173e905ec4fb58
    entrypoint: ["sh", "/src/apply.sh"]
    environment:
      AWS_SHARED_CREDENTIALS_FILE: /credentials/deployer
    volumes:
      - ./terraform:/src:ro
      # The repo's own `biac build` output; the deploy test swaps in a fixture.
      - ${BIAC_SITE_DIR:-../../build}:/site:ro
      - credentials:/credentials
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # A scratch image with no shell or client, so it carries no healthcheck;
  # the probe reads through it to prove it answers.
  signer:
    image: public.ecr.aws/aws-observability/aws-sigv4-proxy:1.13.1@sha256:d9e62d98e8a1fc8ba8859f491a5792f9134c453a38cc4f529145149eb255bfb9
    command:
      - --name=s3
      - --region=us-east-1
      - --host=moto:5000
      - --upstream-url-scheme=http
    environment:
      AWS_SHARED_CREDENTIALS_FILE: /credentials/reader
    volumes:
      - credentials:/credentials:ro
    depends_on:
      terraform:
        condition: service_completed_successfully

  # The identity provider, a realm shaped like an Entra ID tenant. Browsers
  # reach it through Caddy on the app's own origin, so its issuer is the
  # edge URL; oauth2-proxy reaches the token and key endpoints directly.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ["start", "--import-realm"]
    labels:
      org.biac.note: "local demonstration — not a production identity provider"
    environment:
      # Every token's `iss` names the edge, however Keycloak is reached;
      # requests on the compose network get back-channel endpoints on the
      # host they used.
      KC_HOSTNAME: https://localhost:8443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # The file-backed store, named so the realm visibly lives and dies
      # with the container.
      KC_DB: dev-file
      # Reachable only on the compose network: Caddy routes no /admin path.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      # The image has bash but no HTTP client. Readiness is the status line:
      # while the realm imports, the 503 body still lists sub-checks "UP".
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '
      interval: 3s
      timeout: 2s
      retries: 60

  # The sign-in gate. A distroless image with no shell or client, so it
  # carries no healthcheck; Caddy's healthcheck reaches it through the edge.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    command: ["--config=/oauth2-proxy.cfg"]
    labels:
      org.biac.note: "local demonstration — not a production sign-in gate"
    volumes:
      - ./oauth2-proxy.cfg:/oauth2-proxy.cfg:ro
    depends_on:
      keycloak:
        condition: service_healthy

  caddy:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    labels:
      org.biac.note: "local demonstration — not a production store"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      # Healthy means both halves of a read answer: sign-in through the edge
      # (oauth2-proxy redirects to Keycloak's login form, which wget follows)
      # and the bucket through the signer, which the gate keeps off the edge
      # without a session. BusyBox wget verifies through OpenSSL, which reads
      # SSL_CERT_FILE; set for this command only, since Caddy's own Go TLS
      # client would honour it too.
      test:
        - CMD-SHELL
        - SSL_CERT_FILE=/data/caddy/pki/authorities/local/root.crt wget -q -O /dev/null https://localhost:8443/oauth2/sign_in && wget -q -O /dev/null http://signer:8080/biac-site/index.html
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      signer:
        condition: service_started
      oauth2-proxy:
        condition: service_started

  # A curl inside the network, started only with `--profile probe`; it idles
  # so `docker compose exec probe curl …` can read moto and the signer.
  probe:
    image: curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
    profiles: [probe]
    command: ["sleep", "infinity"]

volumes:
  # Deployer and reader keys; never bound to the host.
  credentials:
