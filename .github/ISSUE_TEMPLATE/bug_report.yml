name: Bug report
description: Something in biac isn't working right
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you see, and what did you expect instead?
      placeholder: Ran `bin/biac build my-project`, got ... — expected ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: biac commit
      description: Output of `git rev-parse --short HEAD` in your clone of the repository.
      placeholder: 95f4a51
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v24.12.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and browser
      placeholder: "Ubuntu 24.04, Chromium 130"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Command output
      description: Paste the failing command's output, or the browser console errors. Never paste credentials, tokens or private data — review before pasting and remove anything you don't want public.
      render: shell
    validations:
      required: false
