name: Security

# The scanners that read the tree, its history and its workflows, in a file of
# their own: ci.yml stays the commit gate, and a weekly run catches drift no
# change triggers (a new advisory, a new audit rule). Every scanner is a release
# binary pinned by version and by sha256, not a marketplace action, so no job
# runs code fetched at run time that a checksum has not vouched for. A scanner
# blocks only where its findings on this tree are real. Job `name:` values are
# the required-check API — a `master` ruleset binds them, so renaming one means
# updating the ruleset in the same commit.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Mondays 04:17 UTC, off the hour so it does not queue behind every other
    # job scheduled on it.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Default-deny: a job inherits nothing unless it re-declares a scope. Even
# checkout needs `contents: read`, since a zero-scope token cannot clone a
# private repository.
permissions: {}

# Keyed on the commit for a push and the cron, so consecutive runs on `master`
# never cancel each other; a pull request keys on its number, so a fresh push
# replaces a stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Pinned twice, by version and by the sha256 the project publishes beside
      # the release (gitleaks_8.30.1_checksums.txt). The marketplace action is
      # not used: its owner lookup needs a token and its binary is not pinned
      # by sum. `.gitleaks.toml` is read from the checkout.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # Full history, because `gitleaks git` reads every commit and a shallow
      # clone hides the old ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `--retry 3` on every download in this file: a release host that answers
      # a 5xx fails the job before any scan runs. curl retries a timeout and the
      # transient HTTP statuses with a doubling wait, and the sha256 check still
      # decides whether the file is the pinned one.
      - name: Install the pinned gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks

      # `--redact` keeps a finding's secret out of the run log, which outlives
      # the branch.
      - name: Scan every commit
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 .'

      # The checkout holds tracked files only, so this reads what the history
      # scan reads, as files.
      - name: Scan the checkout
        run: '"${RUNNER_TEMP}/gitleaks" dir --redact --no-banner --exit-code 1 .'

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Pinned twice, by version and by the sha256 the project publishes
      # (osv-scanner_SHA256SUMS).
      OSV_SCANNER_VERSION: "2.7.0"
      OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned osv-scanner
        run: |
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${RUNNER_TEMP}/osv-scanner" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/osv-scanner"

      # The one lockfile that decides what is installed, named outright so the
      # scan never walks `node_modules/` or a stray fixture. Any advisory on a
      # locked package exits 1.
      - name: Scan the lockfile
        run: '"${RUNNER_TEMP}/osv-scanner" scan source -L pnpm-lock.yaml'

  pnpm-signatures:
    name: pnpm-signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # `pnpm audit signatures` first ships in pnpm 12.15.0; the repo's own
      # pnpm 10 treats `signatures` as a stray argument and runs a plain
      # advisory audit that passes. So this job brings a second, pinned pnpm
      # and leaves the repo's toolchain alone. Pinned twice, by version and by
      # the sha256 GitHub publishes for the release asset (`gh api
      # repos/pnpm/pnpm/releases/tags/v12.15.0`).
      PNPM_AUDIT_VERSION: "12.15.0"
      PNPM_AUDIT_SHA256: "55b5ed0092bd11176c1669598e231ae52e7cedac59de6efd0d415730f37d0598"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned pnpm
        run: |
          archive="pnpm-linux-x64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/pnpm/pnpm/releases/download/v${PNPM_AUDIT_VERSION}/${archive}"
          echo "${PNPM_AUDIT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/pnpm-audit"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/pnpm-audit"

      # With the `packageManager: pnpm@10…` pin in package.json, pnpm 12 hands
      # the command to pnpm 10 and prints "No known vulnerabilities found",
      # so the switch is turned off. The summary line is then required: a
      # fallback to an advisory audit exits 0 and would otherwise pass without
      # one signature checked. The audit reads `pnpm-lock.yaml`, so no install
      # runs and no second lockfile exists.
      - name: Verify the registry signature of every locked package
        env:
          pnpm_config_manage_package_manager_versions: "false"
        run: |
          "${RUNNER_TEMP}/pnpm-audit/pnpm" audit signatures > "${RUNNER_TEMP}/signatures.txt"
          cat "${RUNNER_TEMP}/signatures.txt"
          grep -q "packages have verified registry signatures" "${RUNNER_TEMP}/signatures.txt"

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Pinned twice, by version and by the sha256 the project publishes
      # (actionlint_1.7.12_checksums.txt).
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint

      # Syntax, expression types and shellcheck over `run:` scripts, for every
      # file under .github/workflows/. It lints workflows only: the composite
      # action under .github/actions/ is zizmor's.
      - name: Lint the workflows
        run: '"${RUNNER_TEMP}/actionlint" -color'

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # zizmor publishes no checksum file, so the sha256 is the one measured on
      # the release asset (zizmor-x86_64-unknown-linux-gnu.tar.gz) when this
      # version was chosen: the newest release older than two weeks.
      ZIZMOR_VERSION: "1.31.1"
      ZIZMOR_SHA256: "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned zizmor
        run: |
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${archive}"
          echo "${ZIZMOR_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" zizmor

      # Plain output, because `--format=sarif` always exits 0 and its upload
      # needs code scanning, which a private repository lacks. `.github/` as the
      # scope audits the composite action under .github/actions/ beside the
      # workflows. The token lets the online audits run (an impostor commit
      # behind a pinned sha, a known-vulnerable action); it reads public
      # metadata only, and it is set on this step alone.
      - name: Audit the workflows and the composite action
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"${RUNNER_TEMP}/zizmor" --persona pedantic --no-progress .github/'

  opengrep:
    name: opengrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # opengrep publishes a cosign signature, not a sum file, so the sha256 is
      # the one measured on the release asset (opengrep_manylinux_x86) when this
      # version was chosen: the newest release older than two weeks. The rules
      # are the project's own mirror at a commit; that repository is archived,
      # so they will not move. Never `--config auto`, which fetches third-party
      # rules at run time.
      OPENGREP_VERSION: "1.32.0"
      OPENGREP_SHA256: "7360d60174880bd9214f2dfbe439b7bce82b7a3d44cfe945ba833c85cc8bda75"
      OPENGREP_RULES_SHA: "f1d2b562b414783763fd02a6ed2736eaed622efa"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned opengrep
        run: |
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  ${RUNNER_TEMP}/opengrep" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/opengrep"

      # A fetch by commit, so the tree is what the SHA names and nothing else.
      - name: Fetch the pinned rules
        run: |
          git init --quiet "${RUNNER_TEMP}/opengrep-rules"
          git -C "${RUNNER_TEMP}/opengrep-rules" fetch --quiet --depth 1 \
            https://github.com/opengrep/opengrep-rules.git "${OPENGREP_RULES_SHA}"
          git -C "${RUNNER_TEMP}/opengrep-rules" checkout --quiet FETCH_HEAD

      # Reports and does not block. The security rule directories alone flag 28
      # places on this tree and none is a defect: a `value = value[part]` read
      # that the prototype-pollution rule takes for a write, regexes built from
      # test fixtures or from an escaped name, an `innerHTML` in a unit test,
      # the five-character HTML escape the replaceAll rule cannot see whole, a
      # linear hostname pattern flagged as ReDoS, and local `./.github/actions`
      # uses that the unpinned-action rule reads as third-party (zizmor owns
      # that check). The best-practice and i18n directories add 400 more and
      # are left out. A scanner that always fails teaches readers to ignore
      # it, so there is no `--error`: findings exit 0. Re-read them when a rule
      # is added that has a real one to catch.
      - name: Scan the sources
        run: |
          rules="${RUNNER_TEMP}/opengrep-rules"
          "${RUNNER_TEMP}/opengrep" scan --quiet --disable-version-check \
            --config "${rules}/javascript/lang/security" \
            --config "${rules}/javascript/browser" \
            --config "${rules}/javascript/audit" \
            --config "${rules}/typescript/lang/security" \
            --config "${rules}/typescript/react/security" \
            --config "${rules}/bash" \
            --config "${rules}/yaml/github-actions/security" \
            --config "${rules}/yaml/docker-compose" \
            --config "${rules}/dockerfile/security" \
            --text-output "${RUNNER_TEMP}/opengrep.txt" \
            --sarif-output "${RUNNER_TEMP}/opengrep.sarif" \
            src scripts test .github Dockerfile
          cat "${RUNNER_TEMP}/opengrep.txt"

      # A plain artifact, not a code-scanning upload: that needs a public
      # repository.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: opengrep-findings
          path: |
            ${{ runner.temp }}/opengrep.txt
            ${{ runner.temp }}/opengrep.sarif
          retention-days: 14

  grype:
    name: grype
    # Its input changes with the Dockerfile alone and a pull request spends
    # minutes, so it runs on `master`, the weekly cron and a manual dispatch.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Pinned twice, by version and by the sha256 the project publishes
      # (grype_0.121.0_checksums.txt): the newest release older than two weeks.
      GRYPE_VERSION: "0.121.0"
      GRYPE_SHA256: "64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned grype
        run: |
          archive="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/${archive}"
          echo "${GRYPE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" grype

      # The image is the last `FROM` of the Dockerfile, the runtime stage that
      # ships, read at run time so a base bump cannot leave this scan on a stale
      # digest. It is fetched without a Docker daemon (`registry:`). Only a CVE
      # with a fix blocks: an unfixed one is listed and nothing can be done
      # about it. The vulnerability database is fetched fresh on purpose, since
      # a weekly run exists to meet advisories published after the last commit.
      # A red run means the base needs a newer digest.
      - name: Scan the runtime base image
        run: |
          image="$(grep -E '^FROM ' Dockerfile | tail -1 | cut -d' ' -f2)"
          "${RUNNER_TEMP}/grype" "registry:${image}" --platform linux/amd64 \
            --only-fixed --fail-on medium

  codeql:
    name: codeql (${{ matrix.language }})
    # Uploading the analysis needs code scanning, which a private repository
    # only has with a paid licence. The job is written now and skipped until the
    # repository is public, rather than failing on every run.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the analysis to code scanning
      actions: read # CodeQL reads workflow metadata
    strategy:
      fail-fast: false
      matrix:
        # Neither language compiles anything: `actions` reads the workflows and
        # the composite action, `javascript-typescript` reads the sources.
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: dependency-review
    # The dependency graph this action diffs exists only on a public repository
    # (or one with GitHub Advanced Security), and it compares a pull request's
    # base and head, so it has nothing to do on any other event.
    if: ${{ github.event_name == 'pull_request' && github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocks a pull request that adds a dependency with a high or critical
      # advisory; osv-scanner owns the whole lockfile. The license check is off
      # because no license policy exists to enforce, and the summary stays out
      # of the pull request so the job needs no write scope.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: false
          comment-summary-in-pr: never
